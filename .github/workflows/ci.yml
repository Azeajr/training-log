name: CI

# One workflow proves a change and ships it (web-harness CI shape):
#
#   scope → checks (lint, coverage, build → dist artifact) → e2e ∥ smoke ∥ verify-sw → verdict
#                                                          └→ deploy (main only: checks + smoke)
#
# NO paths filter on the triggers, deliberately. A workflow skipped by
# `paths-ignore` never reports, and a REQUIRED check that never reports leaves
# the PR on "Expected — waiting for status" forever (#165). `verdict` always
# runs and always reports; `scope` decides inside the workflow what a change
# needs, with a skip-list for prose so an unknown file counts as code.
#
# Deploy ships the exact bytes `checks` built and `smoke` proved (digest-checked),
# never a second build. It waits for the smoke, not for E2E: a flaky browser
# test must not block shipping, and E2E is already required to merge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # pull_request.number is empty on a push event; fall back to the ref.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push makes an older PR run pointless. A main run may be deploying.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - id: scope
        uses: Azeajr/web-harness/.github/actions/scope@v0.1.2
        with:
          # Only prose that no test reads belongs here.
          skip: '^(README\.md|ROADMAP\.md|CLAUDE\.md|\.claude/COMMON_MISTAKES\.md|docs/diagnostic-trace\.md|docs/design/band-loading\.md)$'
          deploy-include: '^(src/|public/|index\.html$|package\.json$|pnpm-lock\.yaml$|vite\.config\.|tsconfig)'
          deploy-exclude: '\.test\.|^src/test-setup\.ts$'

  checks:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: Azeajr/web-harness/.github/actions/setup@v0.1.2
        with:
          node-version: 24
      # Supply-chain gate before anything runs installed code.
      - run: pnpm audit signatures
      - run: pnpm run check:ci
      # Every critical journey maps to a test that exists, or says why not.
      - run: pnpm exec web-harness scenarios
      - id: digest
        run: echo "digest=$(pnpm exec web-harness digest dist)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    needs: [scope, checks]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: Azeajr/web-harness/.github/actions/setup@v0.1.2
        with:
          node-version: 24
          browsers: chromium
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.sha }}
          path: dist
      - run: pnpm exec web-harness digest dist --expect "$DIGEST"
        env:
          DIGEST: ${{ needs.checks.outputs.digest }}
      # The suite serves the artifact instead of rebuilding it.
      - run: pnpm test:e2e --reporter=list,json
        env:
          WEB_HARNESS_PREBUILT: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
      - run: pnpm exec web-harness scenarios --results e2e-results.json
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  smoke:
    needs: [scope, checks]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Azeajr/web-harness/.github/actions/setup@v0.1.2
        with:
          node-version: 24
          browsers: chromium
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.sha }}
          path: dist
      - run: pnpm exec web-harness digest dist --expect "$DIGEST"
        env:
          DIGEST: ${{ needs.checks.outputs.digest }}
      - run: pnpm smoke
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: .web-harness/smoke/
          include-hidden-files: true
          retention-days: 7

  # Offline shell, SW cache hygiene and the notification paths, against the
  # same artifact. OS delivery of a notification is outside what it can prove.
  verify-sw:
    needs: [scope, checks]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: Azeajr/web-harness/.github/actions/setup@v0.1.2
        with:
          node-version: 24
          browsers: chromium
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.sha }}
          path: dist
      - run: node scripts/verify-notify-hardening.js

  # THE required status check.
  verdict:
    needs: [scope, checks, e2e, smoke, verify-sw]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Azeajr/web-harness/.github/actions/verdict@v0.1.2
        with:
          needs: ${{ toJSON(needs) }}
          code: ${{ needs.scope.outputs.code }}
          required: checks e2e smoke verify-sw

  deploy:
    needs: [scope, checks, smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.scope.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Installs the lockfile-pinned, signature-audited wrangler; nothing is rebuilt.
      - uses: Azeajr/web-harness/.github/actions/setup@v0.1.2
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.sha }}
          path: dist
      - run: pnpm exec web-harness digest dist --expect "$DIGEST"
        env:
          DIGEST: ${{ needs.checks.outputs.digest }}
      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy dist --project-name 531-log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5141f0dec18e8fb0aa0942a9f09f982d
