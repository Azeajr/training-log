name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/**/*.test.*'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.*'
      - 'tsconfig*'

# Least-privilege GITHUB_TOKEN: deploy needs no repo writes.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit signatures

      - run: pnpm run check:ci

      # `pnpm exec`, not `pnpm dlx`: wrangler is a lockfile-pinned devDependency,
      # so it is installed by --frozen-lockfile above and signature-audited with
      # everything else, rather than fetched unpinned from the registry at deploy
      # time and run with a production token.
      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy dist --project-name 531-log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5141f0dec18e8fb0aa0942a9f09f982d
