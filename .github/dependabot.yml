# Weekly dependency security updates. Keeps the supply-chain attack window
# small without flooding the inbox.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # web-harness upgrades also move the ci.yml action refs and reinstall the agent
    # skill, so they stay manual. Dependabot also mis-orders its git tags: it
    # proposed v0.2.4 -> v0.2.2.
    ignore:
      - dependency-name: "@azeajr/web-harness"
    groups:
      # Bundle non-security minor/patch bumps into a single PR per ecosystem.
      # Security advisories still open their own PR.
      pnpm-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # The web-harness actions move with the package pin (see the npm entry).
    ignore:
      - dependency-name: "Azeajr/web-harness*"
