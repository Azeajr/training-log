<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Training Log">
  <!-- The app's own palette: --color-accent #4ade80 on --color-bg #000000.
       The icon this replaced was scaffold left over from another project,
       drawn in purple and blue with no relation to the design tokens (F81).

       A loaded bar: thin shaft, two graduated plates a side. The graduation is
       what stops it reading as a letter H at small sizes — a single plate pair
       of even height does exactly that.

       Every shape is symmetric about x=256, and the whole mark sits inside the
       maskable safe circle (radius 204.8 from centre): the outermost corner is
       193.7 away, so one file serves `any` and `maskable` alike. -->
  <rect width="512" height="512" fill="#000000"/>
  <g fill="#4ade80">
    <rect x="40"  y="242" width="432" height="28"  rx="6"/>
    <rect x="150" y="136" width="44"  height="240" rx="8"/>
    <rect x="318" y="136" width="44"  height="240" rx="8"/>
    <rect x="104" y="176" width="32"  height="160" rx="6"/>
    <rect x="376" y="176" width="32"  height="160" rx="6"/>
  </g>
</svg>
